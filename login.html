<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Address Book Management System</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS (Flat Path) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Top Navigation / Back Button -->
            <div class="auth-top-nav">
                <a href="index.html" class="btn-back-nav" title="Return to Dashboard">
                    <i class="bi bi-arrow-left"></i>
                    <span>Back to Dashboard</span>
                </a>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1 small rounded-pill">
                    <i class="bi bi-shield-lock-fill me-1"></i> Secure Auth
                </span>
            </div>

            <!-- Project Branding -->
            <div class="auth-brand">
                <div class="auth-brand-icon">
                    <i class="bi bi-person-lines-fill"></i>
                </div>
                <div class="auth-brand-text">
                    <h4>AddressBook</h4>
                    <p>SR University • WTMP Project (B36_Team 4)</p>
                </div>
            </div>

            <!-- Advanced Feature Pills -->
            <div class="auth-badges-row">
                <span class="auth-pill"><i class="bi bi-database-check text-primary"></i> MySQL 8.0</span>
                <span class="auth-pill"><i class="bi bi-key-fill text-warning"></i> Bcrypt Salted</span>
                <span class="auth-pill"><i class="bi bi-lock-fill text-success"></i> Session Guard</span>
            </div>

            <div class="mb-4">
                <h3 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Welcome back</h3>
                <p class="text-muted small">Enter your credentials to access your private address book.</p>
            </div>

            <!-- Dynamic Alert Container -->
            <div id="alertMessage" class="alert d-none" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label fw-semibold small">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 ps-0" id="loginEmail" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="loginPassword" class="form-label fw-semibold small mb-0">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                        <button class="btn btn-outline-secondary border-start-0 bg-transparent text-muted" type="button" id="togglePasswordBtn">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                        <label class="form-check-label small text-muted" for="rememberMe">
                            Stay signed in (24 hrs)
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginSubmitBtn">
                    <span class="spinner-border spinner-border-sm d-none me-2" id="loginSpinner" role="status"></span>
                    Sign In to AddressBook
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">Don't have an account yet? 
                    <a href="register.html" class="fw-bold text-decoration-none" style="color: var(--primary-color);">
                        Create one now <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Authentication Logic (Flat Path) -->
    <script src="auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Digital Address Book Management System</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS (Flat Path) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Top Navigation / Back Button -->
            <div class="auth-top-nav">
                <a href="login.html" class="btn-back-nav" title="Back to Login">
                    <i class="bi bi-arrow-left"></i>
                    <span>Back to Login</span>
                </a>
                <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 small rounded-pill">
                    <i class="bi bi-person-check-fill me-1"></i> New Account
                </span>
            </div>

            <!-- Project Branding -->
            <div class="auth-brand">
                <div class="auth-brand-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <div class="auth-brand-text">
                    <h4>AddressBook</h4>
                    <p>SR University • WTMP Project (B36_Team 4)</p>
                </div>
            </div>

            <!-- Advanced Feature Pills -->
            <div class="auth-badges-row">
                <span class="auth-pill"><i class="bi bi-shield-lock text-primary"></i> Isolated Contacts</span>
                <span class="auth-pill"><i class="bi bi-lightning-charge text-warning"></i> Instant Search</span>
                <span class="auth-pill"><i class="bi bi-cloud-arrow-down text-info"></i> CSV Export</span>
            </div>

            <div class="mb-4">
                <h3 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Create Account</h3>
                <p class="text-muted small">Register to start organizing your private address book.</p>
            </div>

            <!-- Dynamic Alert Container -->
            <div id="alertMessage" class="alert d-none" role="alert"></div>

            <!-- Registration Form -->
            <form id="registerForm" novalidate>
                <div class="mb-3">
                    <label for="regName" class="form-label fw-semibold small">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" id="regName" placeholder="e.g. Bommasani Gunadeep" required autocomplete="name">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="regEmail" class="form-label fw-semibold small">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 ps-0" id="regEmail" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="regPassword" class="form-label fw-semibold small mb-0">Password (Min. 6 chars)</label>
                        <span class="text-muted" style="font-size: 0.72rem;" id="passwordStrengthLabel"></span>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="regPassword" placeholder="••••••••" required autocomplete="new-password">
                        <button class="btn btn-outline-secondary border-start-0 bg-transparent text-muted" type="button" id="toggleRegPasswordBtn">
                            <i class="bi bi-eye" id="toggleRegPasswordIcon"></i>
                        </button>
                    </div>
                    <!-- Password Strength Bar -->
                    <div class="password-strength-bar">
                        <div class="strength-step" id="strength1"></div>
                        <div class="strength-step" id="strength2"></div>
                        <div class="strength-step" id="strength3"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="regConfirmPassword" class="form-label fw-semibold small">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-shield-check"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="regConfirmPassword" placeholder="••••••••" required autocomplete="new-password">
                        <button class="btn btn-outline-secondary border-start-0 bg-transparent text-muted" type="button" id="toggleConfirmPasswordBtn">
                            <i class="bi bi-eye" id="toggleConfirmPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="registerSubmitBtn">
                    <span class="spinner-border spinner-border-sm d-none me-2" id="registerSpinner" role="status"></span>
                    Create My Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">Already registered? 
                    <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--primary-color);">
                        <i class="bi bi-arrow-left me-1"></i> Sign in here
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Authentication Logic (Flat Path) -->
    <script src="auth.js"></script>
</body>
</html>
